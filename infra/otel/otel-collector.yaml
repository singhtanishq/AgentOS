# AgentOS OpenTelemetry Collector configuration.
# Receives OTLP metrics, traces and logs from the control plane and the
# agent runtime; exposes metrics to Prometheus; logs traces to stdout for
# local debugging.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Aggregate telemetry into batches to reduce export overhead.
  batch:
    timeout: 5s
    send_batch_size: 512

  # Enforce a memory ceiling so the collector cannot exhaust the host.
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # Prometheus scrapes this endpoint for application metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

  # Human-readable local debugging output for traces and logs.
  debug:
    verbosity: basic

extensions:
  # Liveness endpoint for orchestrators that can probe HTTP (the collector
  # image is distroless, so Docker cannot run a shell-based healthcheck).
  health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
