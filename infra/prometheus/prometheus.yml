# AgentOS Prometheus scrape configuration.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: agentos
    environment: local

scrape_configs:
  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector application metrics (exported from OTLP).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Collector self-metrics (pipeline health).
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
