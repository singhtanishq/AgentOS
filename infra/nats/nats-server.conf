# AgentOS NATS server configuration.
# JetStream is the durable backbone for execution jobs and domain events.
listen: 0.0.0.0:4222

http: 0.0.0.0:8222

jetstream {
  store_dir: "/data"
  # Local development sizing; review before any non-local deployment.
  max_memory_store: 512MB
  max_file_store: 2GB
}

# Reject oversized payloads early — execution payloads are small JSON jobs.
max_payload: 1MB
