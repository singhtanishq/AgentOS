# AgentOS local infrastructure stack.
#
#   docker compose up -d          # start infrastructure
#   docker compose --profile apps up -d   # also run the applications
#
# All credentials below are LOCAL-ONLY development defaults.
# Never reuse them outside your machine.
name: agentos

services:
  # ----------------------------------------------------------------
  # Datastores
  # ----------------------------------------------------------------
  postgres:
    image: postgres:18
    container_name: agentos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentos_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentos}
      # Faster local startup; harmless for development data.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:8-alpine
    container_name: agentos-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 192M

  # ----------------------------------------------------------------
  # Messaging
  # ----------------------------------------------------------------
  nats:
    image: nats:2.11-alpine
    container_name: agentos-nats
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./infra/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  # ----------------------------------------------------------------
  # Object storage (S3-compatible)
  # ----------------------------------------------------------------
  # NOTE: MinIO removed anonymous public access to its container images
  # (docker.io/minio/minio now requires authentication). AgentOS uses
  # SeaweedFS in S3 gateway mode as the local S3-compatible store instead,
  # pinned by digest for reproducibility. The S3 API surface (buckets,
  # objects, credentials) is identical from the application's perspective.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:bc7fe36590783a8d7d89052494034d06a6aafa72976579a6aee6c3e3e42707e1
    container_name: agentos-seaweedfs
    command:
      [
        "server",
        "-dir=/data",
        "-ip=seaweedfs",
        "-ip.bind=0.0.0.0",
        "-s3",
        "-s3.port=9000",
        "-master.volumeSizeLimitMB=1024",
        "-volume.max=0",
      ]
    environment:
      WEED_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-agentos-minio}
      WEED_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-agentos_minio_dev}
    ports:
      - "9000:9000" # S3 API
      - "9333:9333" # Master UI / cluster status
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  # ----------------------------------------------------------------
  # Authorization
  # ----------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:1.12.3-static
    container_name: agentos-opa
    command:
      [
        "run",
        "--server",
        "--addr=0.0.0.0:8181",
        "--set=decision_logs.console=true",
      ]
    ports:
      - "8181:8181"
    # The OPA -static image is distroless (no shell), so a Docker
    # healthcheck command cannot run. Liveness is verified externally via
    # GET http://localhost:8181/health (scripts/health-check.sh).
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    # Policy bundles are mounted in the governance milestone
    # (volumes: - ./infra/opa/policies:/policies:ro).

  # ----------------------------------------------------------------
  # Observability
  # ----------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: agentos-otel-collector
    command: ["--config", "/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # Collector health_check extension
    # The collector image is distroless (no shell), so a Docker
    # healthcheck command cannot run; liveness is exposed via the
    # health_check extension on :13133 for external probes.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: agentos-prometheus
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=7d",
        "--web.enable-lifecycle",
      ]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  grafana:
    image: grafana/grafana:12.3.0
    container_name: agentos-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-agentos_grafana_dev}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3001"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3001"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ----------------------------------------------------------------
  # Applications (opt-in: docker compose --profile apps up -d)
  # ----------------------------------------------------------------
  control-plane:
    profiles: ["apps"]
    build: ./services/control-plane
    container_name: agentos-control-plane
    environment:
      AGENTOS_ENV: development
      AGENTOS_HTTP_ADDR: ":8080"
      AGENTOS_DATABASE_URL: postgres://${POSTGRES_USER:-agentos}:${POSTGRES_PASSWORD:-agentos_dev}@postgres:5432/${POSTGRES_DB:-agentos}?sslmode=disable
      AGENTOS_REDIS_ADDR: redis:6379
      AGENTOS_NATS_URL: nats://nats:4222
      AGENTOS_OPA_URL: http://opa:8181
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      opa:
        condition: service_healthy
    restart: unless-stopped

  agent-runtime:
    profiles: ["apps"]
    build: ./services/agent-runtime
    container_name: agentos-agent-runtime
    environment:
      AGENTOS_ENV: development
      AGENTOS_HTTP_ADDR: 0.0.0.0
      AGENTOS_CONTROL_PLANE_URL: http://control-plane:8080
      AGENTOS_NATS_URL: nats://nats:4222
      AGENTOS_OPA_URL: http://opa:8181
    ports:
      - "8090:8090"
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: agentos-web
    ports:
      - "3000:3000"
    depends_on:
      - control-plane
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  prometheus-data:
  grafana-data:
