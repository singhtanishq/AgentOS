name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/control-plane/go.sum
      - name: Vet
        run: go vet -C services/control-plane ./...
      - name: Unit tests (race detector)
        run: go test -C services/control-plane -race ./...
      - name: Build
        run: go build -C services/control-plane ./...

  python-runtime:
    name: Python agent runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --project services/agent-runtime
      - name: Ruff
        run: uv run --project services/agent-runtime ruff check services/agent-runtime
      - name: Mypy
        run: uv run --project services/agent-runtime mypy services/agent-runtime/app
      - name: Tests
        run: uv run --project services/agent-runtime pytest

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync dependencies
        run: uv sync --project services/sdk-python
      - name: Ruff
        run: uv run --project services/sdk-python ruff check services/sdk-python
      - name: Mypy
        run: uv run --project services/sdk-python mypy services/sdk-python/agentos
      - name: Tests
        run: uv run --project services/sdk-python pytest

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @agentos/web lint
      - name: Typecheck
        run: pnpm --filter @agentos/web typecheck
      - name: Unit tests
        run: pnpm --filter @agentos/web test
      - name: Build
        run: pnpm --filter @agentos/web build

  integration:
    name: Integration tests (PostgreSQL + NATS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos_dev
          POSTGRES_DB: agentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/control-plane/go.sum
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Start NATS with JetStream (service containers cannot pass command args)
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.11-alpine -js -m 8222
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8222/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8222/healthz >/dev/null
      - name: Start OPA (service containers cannot pass image command args)
        run: |
          docker run -d --name opa -p 8181:8181 openpolicyagent/opa:1.12.3-static             run --server --addr=0.0.0.0:8181
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8181/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8181/health >/dev/null
      - name: Go migrations + integration tests
        run: go test -C services/control-plane -tags=integration -count=1 ./tests/ ./migrations/
      - name: Seed runtime test schema
        run: |
          go run -C services/control-plane ./cmd/migrate \
            --url "postgres://agentos:agentos_dev@localhost:5432/agentos?sslmode=disable"
      - name: Python execution pipeline tests
        working-directory: services/agent-runtime
        env:
          AGENTOS_INTEGRATION: "1"
          TEST_DATABASE_API_URL: postgres://agentos_api:agentos_app_dev@localhost:5432/agentos
          TEST_DATABASE_WORKER_URL: postgres://agentos_worker:agentos_app_dev@localhost:5432/agentos
        run: |
          # Roles are created by the Go migration run above (cluster-wide).
          uv run pytest tests/test_execution_pipeline.py
